# Self-hosting.
#
# Default: a HOSTED Postgres (Neon, Supabase, RDS, ...). Put its connection string in .env:
#   DATABASE_URL=postgres://user:pass@host/db?sslmode=require
#   docker compose up --build
#
# Local-only alternative (data lives in a Docker volume on this machine, so it dies with it):
#   DATABASE_URL=postgres://livepage:livepage@db:5432/livepage docker compose --profile local-db up --build
#
# App:       http://localhost:1234   (web app, API and live sync)
# Sandbox:   http://localhost:5174   (separate origin for HTML blocks, keep it that way)
services:
  # Optional bundled Postgres, only started with --profile local-db.
  db:
    profiles: ["local-db"]
    image: postgres:17
    environment:
      POSTGRES_USER: livepage
      POSTGRES_PASSWORD: livepage
      POSTGRES_DB: livepage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livepage"]
      interval: 2s
      retries: 20

  # Web app + API + live sync, one port (http://localhost:1234)
  app:
    build: .
    command: pnpm --filter @livepage/server start
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your hosted Postgres connection string (see docker-compose.yml)}
      PG_POOL_MAX: ${PG_POOL_MAX:-5}
      PORT: "1234"
      SANDBOX_URL: ${SANDBOX_URL:-http://localhost:5174}
      SECURE_COOKIES: ${SECURE_COOKIES:-0} # set to 1 behind HTTPS
    ports: ["1234:1234"]
    depends_on:
      db: { condition: service_healthy, required: false }

  # HTML block runner. In production give it a different domain from the app.
  sandbox:
    build: .
    command: pnpm --filter @livepage/sandbox start
    environment:
      PORT: "5174"
      SANDBOX_FRAME_ANCESTORS: ${APP_ORIGIN:-http://localhost:1234}
    ports: ["5174:5174"]

volumes:
  pgdata:
